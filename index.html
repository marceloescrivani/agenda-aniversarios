<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Aniversários</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { padding: 15px; background: #f4f6f9; color: #333; margin: 0; }
    h2 { text-align: center; color: #1a73e8; margin-top: 10px; }
    .card { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
    input, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; }
    button { background: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:active { opacity: 0.8; }
    .btn-secondary { background: #5f6368; }
    .btn-danger { background: #d93025; width: auto; padding: 6px 12px; margin: 0; }
    .btn-edit { background: #f9ab00; width: auto; padding: 6px 12px; margin: 0 5px 0 0; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    .actions { display: flex; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h2>Agenda de Aniversários</h2>

  <!-- Form de Cadastro / Edição -->
  <div class="card">
    <input type="hidden" id="rowId">
    
    <label>Data (Dia/Mês):</label>
    <input type="text" id="data" placeholder="DD/MM" maxlength="5" oninput="mascaraData(this)" inputmode="numeric">
    
    <label>Nome:</label>
    <input type="text" id="nome" placeholder="Nome completo" onblur="formatarNomeInput(this)">
    
    <button id="btnSave" onclick="salvar()">Salvar Registro</button>
    <button id="btnCancel" class="btn-secondary hidden" onclick="limparFormulario()">Cancelar Edição</button>
  </div>

  <!-- Ações e Busca -->
  <div class="card">
    <button onclick="carregarDados()">📋 Listar Todos</button>
    <input type="text" id="search" placeholder="🔍 Pesquisar por nome..." oninput="filtrar()">
  </div>

  <!-- Lista de Resultados -->
  <div class="card">
    <div id="lista">Clique em "Listar Todos" para carregar.</div>
  </div>

  <script>
    // Cole a URL do seu Web App do Apps Script abaixo:
    const API_URL = "https://script.google.com/macros/s/AKfycbxdaagBP2KWA6_Hj3fvTakA2YQwSzjgmLLKwVTehcAkB1XnV2Cchc08VpFcAWCrSyDN/exec";

    let todosRegistros = [];

    // --- MÁSCARA AUTOMÁTICA DE DATA (DD/MM) ---
    function mascaraData(input) {
      let v = input.value.replace(/\D/g, ""); // Remove tudo que não for dígito
      if (v.length > 2) {
        v = v.substring(0, 2) + "/" + v.substring(2, 4);
      }
      input.value = v;
    }

    // --- FORMATAÇÃO DE NOME (Caixa Alta / Minúsculas nas exceções) ---
    function formatarNome(texto) {
      if (!texto) return "";
      
      // Exceções em minúsculo (preposições/conectivos comuns)
      const excecoes = ["de", "da", "do", "das", "dos", "e"];
      
      const palavras = texto.trim().toLowerCase().split(/\s+/);
      
      const formatadas = palavras.map((palavra, index) => {
        // Se for uma das exceções e NÃO for a primeira palavra do nome
        if (excecoes.includes(palavra) && index > 0) {
          return palavra;
        }
        // Primeira letra em maiúscula, restante em minúscula
        return palavra.charAt(0).toUpperCase() + palavra.slice(1);
      });
      
      return formatadas.join(" ");
    }

    function formatarNomeInput(input) {
      input.value = formatarNome(input.value);
    }

    // --- REQUISIÇÕES E LÓGICA DE DADOS ---
    async function carregarDados() {
      const listaDiv = document.getElementById('lista');
      listaDiv.innerHTML = "Carregando...";
      try {
        const res = await fetch(API_URL);
        todosRegistros = await res.json();
        exibirLista(todosRegistros);
      } catch (err) {
        listaDiv.innerHTML = "Erro ao carregar dados.";
      }
    }

    function exibirLista(lista) {
  const listaDiv = document.getElementById('lista');
  if (lista.length === 0) {
    listaDiv.innerHTML = "Nenhum registro encontrado.";
    return;
  }
  
  const anoAtual = new Date().getFullYear();

  listaDiv.innerHTML = lista.map(item => {
    // Extrai apenas o dia (primeira parte antes da barra)
    const partes = item.data ? item.data.split('/') : [];
    const dia = partes[0] || item.data;
    const dataDiaAno = `${dia}/${anoAtual}`;

    return `
      <div class="list-item">
        <div>
          <strong>${item.nome}</strong><br>
          <small>🎉 ${dataDiaAno}</small>
        </div>
        <div class="actions">
          <button class="btn-edit" onclick="prepararEdicao(${item.rowId}, '${item.data}', '${item.nome}')">✏️</button>
          <button class="btn-danger" onclick="excluir(${item.rowId})">🗑️</button>
        </div>
      </div>
    `;
  }).join('');
}

    function filtrar() {
      const termo = document.getElementById('search').value.toLowerCase();
      const filtrados = todosRegistros.filter(item => 
        item.nome.toString().toLowerCase().includes(termo)
      );
      exibirLista(filtrados);
    }

    async function salvar() {
      const rowId = document.getElementById('rowId').value;
      const dataInput = document.getElementById('data').value;
      const nomeInput = document.getElementById('nome').value;

      if (!dataInput || !nomeInput) {
        alert("Preencha todos os campos!");
        return;
      }

      // Garante a formatação antes de enviar para a planilha
      const data = dataInput;
      const nome = formatarNome(nomeInput);

      const action = rowId ? 'update' : 'insert';
      const payload = { action, rowId, data, nome };

      document.getElementById('btnSave').innerText = "Enviando...";

      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      limparFormulario();
      carregarDados();
    }

    function prepararEdicao(rowId, data, nome) {
      document.getElementById('rowId').value = rowId;
      document.getElementById('data').value = data;
      document.getElementById('nome').value = formatarNome(nome);
      document.getElementById('btnSave').innerText = "Atualizar Registro";
      document.getElementById('btnCancel').classList.remove('hidden');
    }

    function limparFormulario() {
      document.getElementById('rowId').value = '';
      document.getElementById('data').value = '';
      document.getElementById('nome').value = '';
      document.getElementById('btnSave').innerText = "Salvar Registro";
      document.getElementById('btnCancel').classList.add('hidden');
    }

    async function excluir(rowId) {
      if (!confirm("Deseja realmente excluir este aniversário?")) return;

      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', rowId })
      });

      carregarDados();
    }
  </script>
</body>
</html>

  <!-- MANTENHA SEU HTML EXISTENTE AQUI -->

  <script>
    // Registra o Service Worker para habilitar o PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA Service Worker Registrado com sucesso!'))
          .catch((err) => console.log('Falha ao registrar Service Worker:', err));
      });
    }

    // MANTENHA SEU CÓDIGO JAVASCRIPT EXISTENTE AQUI (API_URL, mascaraData, formatarNome, etc.)
  </script>
</body>
</html>
